# Alert rules (R-18). Trigger SocServiceDown with: make alert-demo
groups:
  - name: soc-availability
    rules:
      - alert: SocServiceDown
        expr: probe_success{job="soc-https"} == 0
        for: 30s
        labels:
          severity: critical
          risk: R-18
        annotations:
          summary: "{{ $labels.instance }} is unreachable over mTLS"
          description: >
            The blackbox probe has failed for 30s. Hunts and enrichment depend on this
            component; telemetry is not being searched while it is down.

      - alert: MonitoringTargetDown
        expr: up{job="monitoring"} == 0
        for: 1m
        labels:
          severity: warning
          risk: R-18
        annotations:
          summary: "monitoring component {{ $labels.instance }} is down"

      - alert: CertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job="soc-https"} - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
          risk: R-07
        annotations:
          summary: "certificate on {{ $labels.instance }} expires in under 14 days"
          description: "Rotate with REISSUE=1 make pki, then make destroy && make deploy."
