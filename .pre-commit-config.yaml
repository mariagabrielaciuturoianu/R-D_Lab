# Hook revisions are pinned to full commit SHAs; the tag is kept in a trailing comment.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: a9e1950fe247fbb08817393121691474c55a6cfa  # v8.21.2
    hooks:
      - id: gitleaks                                # R-02: block plaintext secrets
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: no-commit-to-branch                     # R-01: refuse local commits on main
        args: [--branch, main]
      - id: check-added-large-files                 # R-02: catch dumped keystores/archives
      - id: detect-private-key                      # R-02: second layer for PEM keys
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
