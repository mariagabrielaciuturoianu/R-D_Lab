# Keeps SHA pins and digests fresh through reviewed pull requests (R-15).
# The cooldown holds each new release back for 7 days: compromised releases are usually
# caught and pulled within days, before Dependabot would propose them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /toolkit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Python minor versions move deliberately: new ones can lack wheels the toolkit
      # needs (3.15 had no compiled PyYAML, so sigma failed to start). Patches still flow.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /toolkit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # sigma-cli 4 needs pySigma 2; the OpenSearch backend still requires pySigma 1.
      # Remove once pysigma-backend-opensearch supports pySigma 2.
      - dependency-name: sigma-cli
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /
    # The root entry would otherwise also pick up toolkit/requirements.txt (duplicate PRs).
    exclude-paths:
      - "toolkit/**"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: sigma-cli
        update-types: ["version-update:semver-major"]
